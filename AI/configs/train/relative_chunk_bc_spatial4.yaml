# Controlled spatial-encoder ablation for the provisional relative UMI dataset.
# All training values match relative_chunk_bc.yaml; only the fixed spatial grid
# differs.  A 4x4 grid retains coarse image location before projection, whereas
# the baseline's implicit grid size 1 globally averages the feature map.
model:
  encoder_channels: [32, 64, 128, 256]
  feature_dim: 256
  spatial_grid_size: 4
  hidden_dims: [512, 512]
  dropout: 0.1

train:
  epochs: 30
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  val_fraction: 0.2
  seed: 0
  grad_clip: 1.0
  num_workers: 0

data:
  image_mean: 0.5
  image_std: 0.5
