# BC (Behavior Cloning) 학습 설정
#
# ⚠️ 이 파일은 학습 하이퍼파라미터다. 하드웨어 값은 configs/so101.yaml 에 있고
#    거기 있는 것을 여기에 복사하지 않는다.
#
# ⚠️ 통과 기준은 validation loss 가 아니라 롤아웃 성공률이다.
#    게이트: 학습 정책 성공률 > 20.0% (eval/rollout.py 의 GATES)

model:
  # 카메라별 인코더를 따로 둘지 공유할지.
  # separate: 정면·손목은 시야 통계가 달라 표준적으로 분리한다 (ACT/Diffusion Policy)
  # shared:   파라미터 절반. Jetson 8GB 제약이 빡빡해지면 여기서 줄인다
  encoder_mode: separate      # separate | shared
  encoder_channels: [32, 64, 128, 256]   # 작은 CNN. 스트라이드 2씩 4단계
  feature_dim: 256            # 카메라당 인코더 출력 차원
  hidden_dims: [512, 256]     # 결합 후 MLP
  dropout: 0.1
  use_state: true             # 관절 state(6) 를 입력에 넣는다

  # 무엇을 회귀할 것인가. 저장 포맷과 데이터 계약은 이 값과 무관하다 —
  # 데이터셋에는 언제나 절대 관절각이 들어 있고, 이건 학습·추론 시점의 변환이다.
  #
  # joint_absolute: 목표 = action (절대 관절각)
  # joint_delta:    목표 = action - state (잔차). 출력에 state 를 더해 행동을 만든다
  #
  # ⚠️ 실측 근거 (2026-09-02, image_sensitivity):
  #    절대 목표에서는 **상태만으로 정답의 86% 가 설명된다.** 물체가 옮겨지면 팔도
  #    다른 곳에 있고 그 변위가 곧 정답 차이라, 신경망이 이미지를 볼 이유가 없었다.
  #    잔차로 바꾸면 그 86% 가 목표에서 사라지고, 남는 것(에피소드 간 차이 0.000773)은
  #    물체 위치를 알아야만 설명되는 몫이다. 그 크기는 틱당 이동량과 같은 규모다.
  #
  # ⚠️ 실측 근거 (2026-09-02, trace_execution 1편 외우기 검사):
  #    joint_delta 에서 팔 관절 5개는 오차가 필요 이동량의 0.14~0.20배까지 내려갔지만
  #    그리퍼는 1.07배 — 전혀 배우지 못했다. 그리퍼 명령은 에피소드당 두 번만 바뀌는
  #    설정값이라 델타가 141스텝 중 124스텝에서 정확히 0 이다. L1 의 최적값은 중앙값(0)
  #    이고 신경망은 그걸 배웠다. 폐루프에서 그리퍼가 열리지도 닫히지도 않았다.
  #    → 그리퍼만 절대 명령으로 둔다 (joint_delta_gripper_abs).
  action_space: joint_delta_gripper_abs   # joint_absolute | joint_delta | joint_delta_gripper_abs

train:
  batch_size: 32
  # ⚠️ 실측 기준선과 같은 값이어야 한다. v2·v3·v4·v5 는 전부 --epochs 30 으로
  #    돌렸는데 기본값만 20 이었다. 그래서 --epochs 를 빼먹은 실행이 조용히
  #    비교 불가능한 결과를 냈다 (2026-09-07, v5 seed0: epochs 20 → 0/100,
  #    epochs 30 → 14/100, 95% 구간이 겹치지 않는다) 🟢.
  #    기본값을 바꾸면 이전 실행과의 비교가 깨지므로, 바꿀 때는 EXP_LOG 의
  #    conditions.epochs 로 어느 실행이 어느 값이었는지 먼저 확인한다.
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  # L1 은 이상치에 덜 흔들려 모방학습에서 관례적으로 쓴다 (ACT 도 L1).
  # mse 로 바꿔가며 재보려면 여기만 고친다.
  loss: l1                    # l1 | mse

  # 회귀 목표를 데이터셋 통계로 표준화한다 (관절별 zero-mean unit-std).
  #
  # ⚠️ 실측 근거 (2026-09-02): 이걸 끈 상태에서 1.3M 파라미터 신경망이
  #    141샘플짜리 에피소드 **하나조차 외우지 못했다.** 200 epoch 후 train L1 이
  #    0.0057 에서 멈췄는데, "항상 0 을 출력"하는 예측기의 L1 이 0.0075 다.
  #    24% 나은 데서 평평해진 것이다.
  #    원인: 계약이 관절 **범위** 기준으로 정규화하는데 델타는 그 범위의
  #    0.0008~0.03 밖에 안 된다. 마지막 선형층은 O(0.1) 규모로 초기화된다.
  #
  # 체크포인트에 통계가 함께 저장된다. 없으면 원 출력을 행동으로 되돌릴 수 없다.
  normalize_target: true
  val_fraction: 0.2
  # val 분할 단위. sample = 같은 에피소드의 다른 틱 (일반화를 재지 않는다 — 실측 val 0.043 에 롤아웃 5.7%)
  #               episode = 에피소드 통째로 홀드아웃 (처음 보는 물체 위치. 롤아웃과 같은 질문)
  val_split: episode         # sample | episode
  seed: 0
  grad_clip: 1.0
  num_workers: 0              # 윈도우/작은 데이터셋에서는 0 이 안전하다
  amp: false                  # GPU 에서 켤 것. CPU 에선 의미 없다

data:
  # 이미지 정규화. uint8 [0,255] -> float [0,1] -> (x - mean) / std
  # ImageNet 통계가 아니라 단순 0.5 다. 사전학습 가중치를 쓰기 시작하면
  # 그때 해당 통계로 바꾸고 D-AI 기록을 남긴다.
  image_mean: 0.5
  image_std: 0.5
  # 증강은 아직 없다. 넣기 전에 무엇을 위한 증강인지 먼저 정한다 —
  # 조명·배경 변주는 시뮬 씬에서 만드는 편이 낫고, 크롭·색변환은
  # 카메라 캘리브레이션 가정을 깨뜨릴 수 있다.
  augment: false

checkpoint:
  dir: checkpoints/bc
  # 주 체크포인트는 **마지막 epoch** 이다. val loss 가 가장 낮은 epoch 은
  # `<이름>_bestval.pt` 로 따로 저장하고 참고용으로만 둔다.
  #
  # ⚠️ 실측 (2026-09-02): val 곡선이 평평한 200 epoch 실행에서 best-val 이
  #    **epoch 1** 이었다. 그 체크포인트로 롤아웃을 돌려 "정책이 0% 다"라고
  #    기록할 뻔했는데, 실제로는 학습되지 않은 신경망을 평가한 것이었다.
  #    이 프로젝트는 val loss 가 "학습이 망가졌나"만 말한다고 규칙으로 박아뒀는데,
  #    정작 체크포인트 선택을 그것이 하고 있었다.
  keep_best_val: true
